name: Build BODYLOG release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BODYLOG_KEYSTORE_B64: ${{ secrets.BODYLOG_KEYSTORE_B64 }}
      BODYLOG_SIGNING_PASSWORD: ${{ secrets.BODYLOG_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate permanent signing credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BODYLOG_KEYSTORE_B64}" ] || [ -z "${BODYLOG_SIGNING_PASSWORD}" ]; then
            echo "::error::Missing BODYLOG_KEYSTORE_B64 or BODYLOG_SIGNING_PASSWORD repository Actions secrets. Do not generate a new signing key every build."
            exit 1
          fi
          printf '%s' "$BODYLOG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bodylog-release.p12"
          echo "BODYLOG_KEYSTORE_PATH=$RUNNER_TEMP/bodylog-release.p12" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/bodylog-release.p12" -storetype PKCS12 -storepass "$BODYLOG_SIGNING_PASSWORD" -alias bodylog-release > /dev/null

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify data compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.bodylog.personal.stable'" app/build.gradle
          grep -q "localStorage.getItem('bodylog_v1')" app/src/main/assets/index.html
          grep -q 'body_photos' app/src/main/java/com/bodylog/personal/BodyPhotoStore.java
          grep -q 'weights_state' app/src/main/java/com/bodylog/personal/WeightWidgetProvider.java

      - name: Assemble signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify final release signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: BODYLOG-permanent-key-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
