name: Validate BODYLOG Android source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify data compatibility
        run: |
          grep -q "applicationId 'com.bodylog.personal.stable'" app/build.gradle
          grep -q "localStorage.getItem('bodylog_v1')" app/src/main/assets/index.html
          grep -q 'body_photos' app/src/main/java/com/bodylog/personal/BodyPhotoStore.java
          grep -q 'restoreUserState' app/src/main/java/com/bodylog/personal/MainActivity.java
      - name: Compile only - NOT an installable stable update
        run: gradle :app:assembleDebug --no-daemon --stacktrace
