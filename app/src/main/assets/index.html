 display();const tick=()=>{if(paused)return;i=(i+1)%entries.length;display()};let timer=setInterval(tick,1150);

function idbOpen(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('IndexedDB unavailable'));return;}
 const r=indexedDB.open('BODYLOG_PROGRESS_PHOTOS',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});
 r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});}
async function loadBrowserPhotos(){if(nativePhotos())return;try{browserDb=browserDb||await idbOpen();let all=await new Promise((resolve,reject)=>{const rq=browserDb.transaction('photos').objectStore('photos').getAll();rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error)});
 photoListCache=all.map(({id,date,time,pose})=>({id,date,time,pose}));photoSrcCache={};all.forEach(v=>photoSrcCache[v.id]=v.src);
 }catch(e){console.warn('사진 저장소를 사용할 수 없습니다',e);}}
async function idbPutPhoto(entry){browserDb=browserDb||await idbOpen();return new Promise((resolve,reject)=>{let t=browserDb.transaction('photos','readwrite');t.objectStore('photos').put(entry);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
async function idbDeletePhoto(id){return new Promise((resolve,reject)=>{let t=browserDb.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
async function importBrowserPhoto(file){let src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=src});let w=img.width,h=img.height,scale=Math.min(1,1500/Math.max(w,h));
 const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 await saveBrowserPhoto(c.toDataURL('image/jpeg',.84));}
async function saveBrowserPhoto(src){const d=new Date(),id='b_'+Date.now()+'_'+photoPose,date=toDay(d),time=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 await idbPutPhoto({id,pose:photoPose,date,time,src});await loadBrowserPhotos();}
async function openBrowserCamera(){

 catch(e){toast('카메라 권한 또는 HTTPS가 필요합니다. 갤러리에서 추가하세요.');$('#photoFile')?.click();return;}
 browserCameraStream=stream;const last=photoArray()[0],ghost=last?photoSrc(last.id,true):'';

 document.body.appendChild(layer);const video=layer.querySelector('#livecam');video.srcObject=stream;await video.play().catch(()=>{});
 if(ghost)layer.querySelector('#ghost').src=ghost;
 layer.querySelector('#ghostAlpha').oninput=e=>layer.querySelector('#ghost').style.opacity=(+e.target.value)/100;
 const close=()=>{stream.getTracks().forEach(t=>t.stop());browserCameraStream=null;layer.remove();};
 layer.querySelector('#closeWebCamera').onclick=close;
 layer.querySelector('#webCapture').onclick=async()=>{const btn=layer.querySelector('#webCapture');btn.disabled=true;
 for(let k=3;k>=1;k--){btn.textContent=k+'초 후 촬영';await new Promise(r=>setTimeout(r,1000));}
 try{let c=document.createElement('canvas'),w=video.videoWidth,h=video.videoHeight,scale=Math.min(1,1600/Math.max(w,h));if(!w||!h)throw Error('camera preview unavailable');
 c.width=Math.round(w*scale);c.height=Math.round(h*scale);c.getContext('2d').drawImage(video,0,0,c.width,c.height);
 await saveBrowserPhoto(c.toDataURL('image/jpeg',.86));close();navigate('photos');toast('사진을 저장했습니다');}
 catch(e){btn.disabled=false;btn.textContent='● 촬영 다시 시도';toast('사진 촬영에 실패했습니다');}
 };
}

// ---- 단식 기록: 종료 세션, 진행 중 세션, 최장 기록을 별도로 관리 ----
const FAST_MAX_HOURS=168;
function msVal(x){const n=new Date(x).getTime();return Number.isFinite(n)?n:NaN}
function spanFmt(ms,short=false){if(!Number.isFinite(ms)||ms<0)return '—';const m=Math.floor(ms/60000), h=Math.floor(m/60);return short?`${h}시간 ${m%60}분`:`${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`}
function fastSessions(){return (state.fast.sessions||[]).filter(s=>Number.isFinite(msVal(s.start))&&Number.isFinite(msVal(s.end))&&msVal(s.end)>msVal(s.start)).slice().sort((a,b)=>msVal(b.end)-msVal(a.end))}
function bestFast(){return Math.max(0,...fastSessions().map(x=>msVal(x.end)-msVal(x.start)))}
function activeFastMs(){if(!state.fast.active)return 0;return Math.max(0,Date.now()-msVal(state.fast.active))}
function dateTimeLocal(date){const d=new Date(date);return toDay(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function displayTime(x){return new Date(x).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}
function fastPeriodStats(days){let bound=msVal(earlier(days-1)+'T00:00:00');let a=fastSessions().filter(s=>msVal(s.end)>=bound);let total=a.reduce((n,s)=>n+msVal(s.end)-msVal(s.start),0);return {count:a.length,total,avg:a.length?total/a.length:0,longest:a.length?Math.max(...a.map(x=>msVal(x.end)-msVal(x.start))):0}}
function fasting(){const sessions=fastSessions(),best=bestFast(),elapsed=activeFastMs(),currentBest=elapsed>best, target=Number(state.fast.targetHours)||14,st=fastPeriodStats(7),active=state.fast.active;
return header('나의 단식 기록.','얼마나 오래 했는지보다, 나에게 지속 가능한 리듬을 기록합니다.')+`
<section class="card fastinghero"><div class="cap">${active?'● 지금 단식 중':'○ 현재 진행 중인 단식 없음'}</div><div class="fastclock" id="fast-clock" data-start="${active?escapeHtml(active):''}">${active?spanFmt(elapsed):'00:00:00'}</div><div class="fastsub">${active?`시작 ${displayTime(active)} · 목표 ${target}시간`:'시작 버튼을 누르면 시간이 자동으로 기록됩니다.'}</div><div class="fastprogress"><i id="fast-progress" style="width:${active?Math.min(100,elapsed/(target*3600000)*100):0}%"></i></div><div class="progresslabels"><span>${active?'경과 '+Math.floor(elapsed/3600000)+'시간':'기록 대기'}</span><span>나의 참고 목표 ${target}시간</span></div><div style="margin-top:16px"><button id="fast-toggle" class="btn wide" style="background:${active?'#eeefff':'#7bdac3'};color:#222746">${active?'■ 단식 종료하고 기록 저장':'▶ 지금부터 단식 시작'}</button></div></section>
${motivationCard()}
<div class="faststats"><div class="faststat"><small>🏆 역대 최장 완료 단식</small><b id="fast-best">${best?spanFmt(best,true):'기록 없음'}</b><em>${sessions.length}회 완료</em></div><div class="faststat"><small>📈 최근 7일 완료</small><b>${st.count}<em> 회</em></b><em>평균 ${st.count?spanFmt(st.avg,true):'기록 없음'}</em></div></div>
${active&&currentBest?'<p class="note">지금 진행 중인 단식이 역대 완료 기록보다 깁니다. 종료하면 최장 기록으로 저장됩니다.</p>':''}
<div class="sectionhead"><h3>단식 목표 시간</h3><span class="mini">개인 참고용 · 경쟁 점수 아님</span></div><section class="card"><div class="formfield"><label for="fast-target">선호하는 시간 (시간)</label><select id="fast-target">${[10,12,13,14,16,18,20,24].map(t=>`<option value="${t}" ${t===target?'selected':''}>${t}시간</option>`).join('')}</select></div><p class="note">장시간 단식은 무리하지 마세요. 최대 기록은 참고 기록이며, 갱신을 권장하는 목표가 아닙니다.</p></section>
<div class="sectionhead"><h3>이전 단식 직접 추가</h3><span class="mini">날짜·시간 수동 입력</span></div><section class="card"><form id="fast-manual" class="fastform"><div class="formfield"><label for="fast-start">단식 시작</label><input type="datetime-local" id="fast-start" value="${dateTimeLocal(new Date(Date.now()-14*3600000))}" required></div><div class="formfield"><label for="fast-end">단식 종료</label><input type="datetime-local" id="fast-end" value="${dateTimeLocal(new Date())}" required></div><button class="btn secondary" type="submit">+ 과거 단식 추가</button></form></section>
<div class="sectionhead"><h3>단식 히스토리</h3><span class="mini">최근 ${sessions.length}개 기록</span></div><section class="card">${sessions.length?sessions.slice(0,50).map(s=>`<div class="fastrow"><div><b>${displayTime(s.start)}</b><small>종료 ${displayTime(s.end)}</small></div><div style="display:flex;align-items:center;gap:10px"><div class="duration">${spanFmt(msVal(s.end)-msVal(s.start),true)}</div><button class="tinybtn danger" data-deletefast="${escapeHtml(s.id)}" aria-label="단식 기록 삭제">삭제</button></div></div>`).join(''):'<div class="empty">아직 완료한 단식이 없습니다. 처음 시작한 기록부터 이곳에 쌓입니다.</div>'}</section><p class="note">※ 단식 기록은 시작~종료 시간을 기준으로 계산합니다. 화면을 꺼도 시작 시간이 저장되어 시간이 계속 계산됩니다. 이 앱은 의료적 단식 처방을 제공하지 않습니다.</p>`}

 document.querySelectorAll('[data-deletefast]').forEach(e=>e.addEventListener('click',()=>{decisionDialog('단식 기록 삭제','선택한 기록을 삭제할까요?',()=>{state.fast.sessions=state.fast.sessions.filter(s=>s.id!==e.dataset.deletefast);persist();navigate('fasting');toast('기록을 삭제했습니다')},'삭제')}));
 $('#exportData')?.addEventListener('click',()=>{const json=JSON.stringify({app:'BODYLOG',schema:2,exportedAt:new Date().toISOString(),state},null,2);if(window.BodylogAndroid?.saveBackup){window.BodylogAndroid.saveBackup(json);return;}const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='BODYLOG_backup_'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('백업 다운로드를 요청했습니다')});
 $('#importData')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5_000_000)throw Error('파일 용량 초과');const j=JSON.parse(await file.text());if(j.app!=='BODYLOG'||!j.state||!Array.isArray(j.state.weights)||!j.state.logs||!Array.isArray(j.state.diaries))throw Error('BODYLOG 백업이 아닙니다');decisionDialog('백업 복원','현재 데이터가 백업 데이터로 대체됩니다. 계속할까요?',()=>{state=j.state;state.fast||={active:null,sessions:[],targetHours:14};persist();navigate('home');toast('백업을 불러왔습니다')},'복원')}catch(err){toast('백업 파일 형식을 확인해 주세요')}});
 $('#resetDemo')?.addEventListener('click',()=>{decisionDialog('모든 기록 초기화','기존 기록을 모두 삭제합니다. 이 작업은 되돌릴 수 없습니다.',()=>{state={goal:90,starting:null,weights:[],logs:{},diaries:[],fast:{active:null,sessions:[],targetHours:14},demo:false};persist();navigate('home');toast('빈 기록으로 초기화했습니다')},'전체 삭제')});
}
function updateTimers(){const t=$('#fast-clock');if(!t||!state.fast.active)return;const elapsed=activeFastMs();t.textContent=spanFmt(elapsed);const pr=$('#fast-progress');if(pr)pr.style.width=Math.min(100,elapsed/(Math.max(1,Number(state.fast.targetHours))*3600000)*100)+'%';}
setInterval(updateTimers,1000);
// 홈과 분석 화면에 단식 기록 카드 연결
const originalHome=home;home=function(){const x=originalHome(),a=state.fast.active,elapsed=activeFastMs(),best=bestFast();const card=`<div class="sectionhead"><h3>⏱ 단식 트래커</h3><button class="actionlink" data-go="fasting">전체 기록 ↗</button></div><section class="card homefast"><div class="splithead"><div><b>${a?'● 단식 진행 중':'단식 기록'}</b><p class="note" style="margin:3px 0">${a?'시작 '+displayTime(a):'시작부터 종료까지 자동 측정'}</p></div><span class="mark">역대 최고 ${best?spanFmt(best,true):'—'}</span></div><div class="fastclock" id="fast-clock">${a?spanFmt(elapsed):'00:00:00'}</div><button class="btn secondary wide" data-go="fasting">${a?'단식 시간 보기 · 종료하기':'단식 시작하기'} →</button></section>`;return x.replace('<div class="sectionhead"><h3>최근 7일 요약</h3>',card+'<div class="sectionhead"><h3>최근 7일 요약</h3>')}
const originalTrends=trends;trends=function(){const x=originalTrends(), st=fastPeriodStats(period), avg=st.count?spanFmt(st.avg,true):'—';const box=`<div class="sectionhead"><h3>단식 통계</h3><span class="mini">종료일 기준 · 최근 ${period}일</span></div><div class="reportgrid"><div class="reportmetric"><small>⏱ 완료한 단식</small><strong>${st.count}<span class="caption">회</span></strong></div><div class="reportmetric"><small>🏆 기간 내 최장</small><strong style="font-size:19px">${st.count?spanFmt(st.longest,true):'—'}</strong></div><div class="reportmetric"><small>📅 평균 단식</small><strong style="font-size:19px">${avg}</strong></div><div class="reportmetric"><small>🗂 역대 최장</small><strong style="font-size:19px">${bestFast()?spanFmt(bestFast(),true):'—'}</strong></div></div>`;return x.replace('<div class="sectionhead"><h3>데이터 해석</h3>',box+'<div class="sectionhead"><h3>데이터 해석</h3>')+`<div class="sectionhead"><h3>내 데이터 관리</h3></div><section class="card"><div class="settingsbuttons"><button class="btn secondary" id="exportData">↓ JSON 백업</button><label class="btn secondary" style="display:grid;place-items:center;cursor:pointer">↑ 백업 가져오기<input id="importData" type="file" accept=".json,application/json" style="display:none"></label></div><p class="datacaption">기록은 이 기기에만 저장됩니다. 다른 휴대폰으로 옮기기 전 백업하세요.</p><button class="simplelink" id="resetDemo">모든 기록 삭제하고 새로 시작</button></section>`}

const photoBaseHome=home;
home=function(){const x=photoBaseHome();refreshPhotoList();const n=photoListCache.length;
const card=`<div class="sectionhead"><h3>📸 몸의 변화 기록</h3><button class="actionlink" data-go="photos">사진 타임라인 ↗</button></div><section class="card"><div class="splithead"><div><b>${n?n+'장의 바디 사진':'첫 바디 사진 촬영하기'}</b><p class="note">전날 사진을 겹쳐 같은 위치에서 촬영하세요.</p></div><button class="btn secondary" data-go="photos">사진 열기 →</button></div></section>`;
return x.replace('<div class="sectionhead"><h3>최근 7일 요약</h3>',card+'<div class="sectionhead"><h3>최근 7일 요약</h3>');}
document.querySelectorAll('.tab').forEach(e=>e.addEventListener('click',()=>navigate(e.dataset.tab)));loadBrowserPhotos().then(()=>{if(active==='photos')navigate('photos')});navigate('home');syncNativeWidget();try{window.BodylogAndroid?.saveUserState?.(JSON.stringify(state))}catch(e){};if('serviceWorker' in navigator&&(/^https?:$/.test(location.protocol)))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
